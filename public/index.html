<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Word Guess Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="login">
        <h2>Enter your name:</h2>
        <input id="playerName" placeholder="Your name..." />

    <div class="settings">
      <select id="gameMode">
        <option value="normal">Chế độ Thường (Đoán Tiếng Anh)</option>
        <option value="reverse">Chế độ Ngược (Đoán từ Tiếng Việt)</option>
      </select>
      <select id="wordPack">
        <option value="words">Mặc định</option>
        <option value="words_animals">Động vật</option>
        <option value="words_jobs">Nghề nghiệp</option>
      </select>
    </div>
    <button id="startBtn">Start Game</button>
  </div>

  <div id="game" style="display:none;">
    <h1>Word Guess Game</h1>
    <img id="image" src="" width="250" />
    <h2 id="hiddenWord"></h2>
    <p>⏳ Time left: <span id="timer">30</span>s</p>
    <input id="guessInput" placeholder="Enter the word..." />
    <h3 id="message"></h3>
    <p id="scoreDisplay"></p>
  </div>

  <div id="endScreen" style="display:none;">
    <h2>⏰ Time’s up!</h2>
    <p id="finalScore"></p>
    <button id="restartBtn">Play Again</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="main.js"></script>
</body>
</html>
